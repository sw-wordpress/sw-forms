name: Tests and SonarQube
on:
  push:
    branches:
    - '**'
  pull_request: null
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: coverage
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql, mbstring, sodium, zip, gd
        tools: composer:v2
        coverage: xdebug
    - run: composer install --prefer-dist --no-interaction --no-progress
    - run: composer validate --strict
    - run: composer cs && composer cs:wp && composer stan
    - name: Unit and integration coverage
      run: |-
        mkdir -p coverage
        vendor/bin/phpunit  --coverage-clover coverage/unit.xml
    - name: Merge and normalize Clover paths
      run: php tests/coverage/merge.php coverage/unit.xml
    - name: Upload Clover coverage
      uses: actions/upload-artifact@v4
      with:
        name: php-coverage
        path: coverage/clover.xml
        if-no-files-found: error
        retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - run: npm ci
    - run: npm run lint && npm run typecheck && npm test && npm run build
  sonarqube:
    name: SonarQube Cloud
    needs:
    - php
    - frontend
    if: |-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: php-coverage
        path: coverage
    - name: Check SonarQube configuration
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo '::error::Set the SONAR_TOKEN repository secret before running SonarQube analysis.'
          exit 1
        fi
        if [ -z "$SONAR_ORGANIZATION" ]; then
          echo '::error::Set the SONAR_ORGANIZATION repository variable to your SonarQube Cloud organization key.'
          exit 1
        fi
        test -s coverage/clover.xml
    - name: Analyze code and import coverage
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: Tests and SonarQube
on:
  pull_request: null
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: swf-test
          MARIADB_DATABASE: swforms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      XDEBUG_MODE: coverage
      WP_ROOT: /tmp/swf-wordpress
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql, mbstring, sodium, zip, gd
        tools: composer:v2
        coverage: xdebug
    - run: composer install --prefer-dist --no-interaction --no-progress
    - run: composer validate --strict
    - name: Audit Composer dependencies for known vulnerabilities
      run: composer audit --locked --no-dev
    - run: composer cs && composer cs:wp && composer stan
    - name: Install disposable WordPress
      run: |
        curl --fail --location https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output /tmp/wp-cli.phar
        php /tmp/wp-cli.phar core download --path="$WP_ROOT"
        php /tmp/wp-cli.phar config create --path="$WP_ROOT" --dbname=swforms --dbuser=root --dbpass=swf-test --dbhost=127.0.0.1:3306
        php /tmp/wp-cli.phar config set DISABLE_WP_CRON true --raw --path="$WP_ROOT"
        php /tmp/wp-cli.phar core install --path="$WP_ROOT" --url=http://localhost --title="SW Forms tests" --admin_user=swf-admin --admin_password=swf-test-admin-password --admin_email=test@example.test --skip-email
        ln -s "$GITHUB_WORKSPACE" "$WP_ROOT/wp-content/plugins/sw-forms"
        php /tmp/wp-cli.phar plugin activate sw-forms --path="$WP_ROOT"
    - name: Install Zsh for documented operator command tests
      run: sudo apt-get update && sudo apt-get install -y zsh
    - name: Unit coverage
      run: |-
        mkdir -p coverage
        vendor/bin/phpunit --coverage-clover coverage/unit.xml --log-junit coverage/unit-junit.xml
    - name: Real WordPress and multipart HTTP coverage
      run: composer coverage:wp
    - name: Isolated verified update tests (single site and multisite, sequential)
      env:
        SWF_TEST_DB_USER: root
        SWF_TEST_DB_PASSWORD: swf-test
        SWF_TEST_DB_PORT: '3306'
      run: |
        php /tmp/wp-cli.phar db query 'CREATE DATABASE IF NOT EXISTS swf_wp_tests CHARACTER SET utf8mb4' --path="$WP_ROOT"
        composer install --working-dir=tests/wp --no-interaction --no-progress
        tests/wp/vendor/bin/phpunit -c tests/wp/phpunit.xml.dist --coverage-clover coverage/wordpress/verified-updates.xml --log-junit coverage/verified-updates-junit.xml
        WP_MULTISITE=1 tests/wp/vendor/bin/phpunit -c tests/wp/phpunit.xml.dist --coverage-clover coverage/wordpress/verified-updates-multisite.xml --log-junit coverage/verified-updates-multisite-junit.xml
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - name: Browser check of verified updates in disposable WordPress
      run: |
        cd apps/admin
        npm ci
        npx playwright-core install --with-deps chromium
        cd ../..
        php /tmp/wp-cli.phar option update home http://localhost:8877 --path="$WP_ROOT"
        php /tmp/wp-cli.phar option update siteurl http://localhost:8877 --path="$WP_ROOT"
        php -S 127.0.0.1:8877 -t "$WP_ROOT" > /tmp/swf-browser-server.log 2>&1 &
        SERVER_PID=$!
        trap 'kill "$SERVER_PID"' EXIT
        node apps/admin/scripts/e2e/verified-updates.mjs
    - name: Merge and normalize Clover paths
      run: php tests/coverage/merge.php coverage/unit.xml coverage/wordpress/*.xml
    - name: Merge PHPUnit test execution
      run: php tests/coverage/junit.php coverage/unit-junit.xml coverage/wordpress-junit.xml coverage/verified-updates-junit.xml coverage/verified-updates-multisite-junit.xml
    - name: Verify adapter coverage was imported
      run: php tests/coverage/check.php
    - name: Upload Clover coverage
      uses: actions/upload-artifact@v7
      with:
        name: php-coverage
        path: |
          coverage/clover.xml
          coverage/junit.xml
        if-no-files-found: error
        retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - run: npm ci
    - name: Audit shipped npm dependencies for known vulnerabilities
      run: npm audit --omit=dev --audit-level=high
    - run: npm run lint && npm run typecheck && npm run test:coverage && npm run build
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage
        path: |
          apps/admin/coverage/lcov.info
          apps/admin/coverage/test-execution.xml
        if-no-files-found: error
        retention-days: 14
  sonarqube:
    name: SonarQube Cloud
    needs:
    - php
    - frontend
    if: |-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v8
      with:
        name: php-coverage
        path: coverage
    - uses: actions/download-artifact@v8
      with:
        name: frontend-coverage
        path: apps/admin/coverage
    - name: Check SonarQube configuration
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo '::error::Set the SONAR_TOKEN repository secret before running SonarQube analysis.'
          exit 1
        fi
        if [ -z "$SONAR_ORGANIZATION" ]; then
          echo '::error::Set the SONAR_ORGANIZATION repository variable to your SonarQube Cloud organization key.'
          exit 1
        fi
        test -s coverage/clover.xml
        test -s apps/admin/coverage/lcov.info
        test -s coverage/junit.xml
        test -s apps/admin/coverage/test-execution.xml
    - name: Analyze code and import coverage
      uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
      with:
        args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  release-artifacts:
    name: Validate real signed release ZIP with disposable key
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: sodium, zip
        tools: composer:v2
        coverage: none
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: apps/admin/package-lock.json
    - name: Prepare disposable production checkout
      run: |
        mkdir -p /tmp/swf-release-build
        git ls-files -z | rsync -a --from0 --files-from=- ./ /tmp/swf-release-build/
        cd /tmp/swf-release-build
        composer install --no-dev --prefer-dist --no-interaction --no-scripts --optimize-autoloader
        mkdir -p libraries
        cp -R vendor/woocommerce/action-scheduler libraries/action-scheduler
        php -r 'foreach (json_decode(file_get_contents("composer.lock"), true)["packages"] as $p) { if ($p["name"] === "woocommerce/action-scheduler") { file_put_contents("vendor/woocommerce/action-scheduler/composer.json", json_encode($p)); } }'
        docker run --rm --user "$(id -u):$(id -g)" -v /tmp/swf-release-build:/project coenjacobs/mozart:1.2.3 /mozart/bin/mozart compose
        cd apps/admin
        npm ci
        npm run build
    - name: Sign and verify actual ZIP, package completeness and missing-secret failure
      run: php tests/check-release-build.php /tmp/swf-release-build /tmp/swf-release-dist

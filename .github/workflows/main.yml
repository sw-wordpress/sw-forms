name: Build release zip

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  PLUGIN_SLUG: sw-forms

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    environment: plugin-releases

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine repository name and version
        id: metadata
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          RAW="${GITHUB_REF_NAME}"
          if ! printf '%s' "$RAW" | grep -Eq '^v?[0-9]+(\.[0-9]+){2,3}(-[0-9]{2})?$'; then exit 1; fi
          VERSION="${RAW#v}"
          VERSION="${VERSION%-*}"

          HEADER="$(sed -n 's/^ \* Version: *//p' sw-forms.php)"
          CONSTANT="$(sed -n "s/define( 'SWF_VERSION', '\([^']*\)' );/\1/p" sw-forms.php)"
          test "$HEADER" = "$VERSION"
          test "$CONSTANT" = "$VERSION"
          echo "repo=$PLUGIN_SLUG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=${PLUGIN_SLUG}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: sodium, zip

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --no-scripts \
            --optimize-autoloader

      - name: Embed release public key (fails closed without signing configuration)
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: php bin/release-manifest.php public-key includes/update/trusted-keys.php

      - name: Isolate dependencies with Mozart
        run: |
          # AS deliberately shares its global API/version negotiation across plugins.
          mkdir -p libraries
          cp -R vendor/woocommerce/action-scheduler libraries/action-scheduler
          # AS archives omit composer.json; Mozart reads it even for excluded packages.
          php -r 'foreach (json_decode(file_get_contents("composer.lock"), true)["packages"] as $package) { if ($package["name"] === "woocommerce/action-scheduler") { file_put_contents("vendor/woocommerce/action-scheduler/composer.json", json_encode($package)); } }'
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/project" \
            coenjacobs/mozart:1.2.3 \
            /mozart/bin/mozart compose

      - name: Verify Mozart output
        run: test -f vendor-prefixed/autoload.php

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Build admin and frontend assets
        working-directory: apps/admin
        run: npm ci && npm run build

      - name: Bundle WordPress plugin
        env:
          REPO_NAME: ${{ steps.metadata.outputs.repo }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          bash bin/build-zip.sh "$GITHUB_WORKSPACE"

      - name: Verify ZIP contents
        env:
          ZIP_FILE: ${{ steps.metadata.outputs.zip }}
        run: |
          unzip -t "$ZIP_FILE"
          unzip -Z1 "$ZIP_FILE" > "$RUNNER_TEMP/zip-contents.txt"
          grep -Fx "$PLUGIN_SLUG/vendor-prefixed/autoload.php" "$RUNNER_TEMP/zip-contents.txt"
          grep -Fx "$PLUGIN_SLUG/sw-forms.php" "$RUNNER_TEMP/zip-contents.txt"
          grep -Fx "$PLUGIN_SLUG/libraries/action-scheduler/action-scheduler.php" "$RUNNER_TEMP/zip-contents.txt"
          grep -q "^$PLUGIN_SLUG/assets/admin/" "$RUNNER_TEMP/zip-contents.txt"
          grep -q "^$PLUGIN_SLUG/assets/frontend/" "$RUNNER_TEMP/zip-contents.txt"
          if grep -Eq "^$PLUGIN_SLUG/(vendor|tests|apps|bin|node_modules|\.git|\.github)/" "$RUNNER_TEMP/zip-contents.txt"; then
            echo "Unexpected development or unprefixed vendor files in ZIP" >&2
            exit 1
          fi

      - name: Upload packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            php -r '$r=json_decode(file_get_contents($argv[1]),true); exit(empty($r["isDraft"])?1:0);' "$RUNNER_TEMP/existing-release.json" \
              || { echo "Release $RELEASE_TAG is already published; refusing to modify it." >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE"/sw-forms-*.zip --clobber
          # Resolve drafts via gh release view; the tag endpoint does not resolve them.
          RELEASE_API_URL="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$RELEASE_API_URL" > "$RUNNER_TEMP/release.json"

      - name: Sign exact uploaded packages
        env:
          SW_PLUGIN_RELEASE_SIGNING_KEY: ${{ secrets.SW_PLUGIN_RELEASE_SIGNING_KEY }}
          SW_PLUGIN_RELEASE_KEY_ID: ${{ vars.SW_PLUGIN_RELEASE_KEY_ID }}
        run: php bin/release-manifest.php sign "$RUNNER_TEMP/release.json" "$GITHUB_WORKSPACE" "$GITHUB_SHA"

      - name: Verify signed artifacts with runtime validators
        run: php bin/verify-release.php "$RUNNER_TEMP/release.json" "$GITHUB_WORKSPACE" includes/update/trusted-keys.php

      - name: Publish complete signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/sw-plugin-release.json" "$GITHUB_WORKSPACE/sw-plugin-release.json.sig" --clobber
          gh release edit "$RELEASE_TAG" --draft=false

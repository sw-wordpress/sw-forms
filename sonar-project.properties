sonar.projectKey=sw-wordpress_sw-forms
sonar.projectName=SW Forms
sonar.sourceEncoding=UTF-8
sonar.sources=assets/js,src,includes,apps/admin/src,apps/admin/shared,apps/admin/frontend,sw-forms.php,uninstall.php
sonar.tests=tests,apps/admin/tests
sonar.exclusions=assets/admin/**,assets/frontend/**
# Duplication only (coverage stays measured): starter templates are declarative data and
# en.ts/de.ts share one key tree by design.
sonar.cpd.exclusions=src/WordPress/Forms/Templates/**,apps/admin/src/i18n/**
sonar.php.version=8.2
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.javascript.lcov.reportPaths=apps/admin/coverage/lcov.info
sonar.php.tests.reportPath=coverage/junit.xml
sonar.testExecutionReportPaths=apps/admin/coverage/test-execution.xml
